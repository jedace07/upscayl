# Deploy Release workflow
# Builds and publishes Linux, macOS, and Windows binaries on tag push or manual trigger
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: volta-cli/action@v5
        with:
          node-version: 24.20.0
          npm-version: latest

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y elfutils rpm libsecret-1-dev

      - name: Install Modules and Publish Build
        run: |
          npm install
          rm -rf node_modules/sharp
          npm config set arch x64
          npm config set platform linux
          npm config set libc glibc
          npm install --build-from-source sharp
          GH_TOKEN=${{ secrets.GITHUB_TOKEN }} npm run publish-linux-app

  macos:
    runs-on: macos-14
    env:
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      APPLEID: ${{ secrets.APPLEID }}
      APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
      TEAMID: ${{ secrets.TEAMID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROVISION_PROFILE: ${{ secrets.PROVISION_PROFILE }}
    steps:
      - uses: actions/checkout@v7

      - uses: volta-cli/action@v5
        with:
          node-version: 24.20.0
          npm-version: latest

      - name: Install Modules and Publish Build
        run: |
          npm install
          rm -rf node_modules/sharp
          echo -n "$PROVISION_PROFILE" | base64 --decode > embedded.provisionprofile
          npm config set platform darwin
          npm config set arch x64
          npm install --build-from-source sharp
          npm config set platform darwin
          npm config set arch arm64
          npm install --build-from-source sharp
          npm run publish-mac-universal-app

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: volta-cli/action@v5
        with:
          node-version: 24.20.0
          npm-version: latest

      - name: Install Modules and Publish Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install
          npm run publish-win-app
