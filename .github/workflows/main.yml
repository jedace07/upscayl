name: Deploy Release

# Deploy Release workflow
# Builds and publishes Linux, macOS, and Windows binaries on tag push or manual trigger
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: volta-cli/action@v5
        with:
          node-version: 24.20.0
          npm-version: latest

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y elfutils rpm flatpak flatpak-builder libsecret-1-dev
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Sdk//25.08 org.freedesktop.Platform//25.08 org.electronjs.Electron2.BaseApp//25.08

      - name: Install Modules and Publish Build
        run: |
          npm install
          GH_TOKEN=${{ secrets.GITHUB_TOKEN }} npm run publish-linux-app

  macos:
    runs-on: macos-14
    env:
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      APPLEID: ${{ secrets.APPLEID }}
      APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
      TEAMID: ${{ secrets.TEAMID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROVISION_PROFILE: ${{ secrets.PROVISION_PROFILE }}
    steps:
      - uses: actions/checkout@v7

      - uses: volta-cli/action@v5
        with:
          node-version: 24.20.0
          npm-version: latest

      - name: Install Modules and Publish Build
        run: |
          npm install
          echo -n "$PROVISION_PROFILE" | base64 --decode > embedded.provisionprofile
          npm run publish-mac-universal-app

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: volta-cli/action@v5
        with:
          node-version: 24.20.0
          npm-version: latest

      - name: Install Modules and Publish Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install
          npm run publish-win-app
